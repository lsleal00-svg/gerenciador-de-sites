<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mudamos de endereço</title><meta name="robots" content="noindex">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#121214;color:#f3ede2;text-align:center;padding:24px}a{color:#e9b949;font-weight:700}</style>
</head><body><main><h1 style="font-size:1.4rem">Mudamos de endereço</h1><p>Abrindo o novo endereço…</p><p><a id="link" href="#">Toque aqui se não abrir sozinho</a></p></main>
<script>
  // qualquer endereço antigo que não existe mais (ex.: /controle/) também vai para o novo
  var base = "/" + location.pathname.split("/")[1] + "/";
  var s1 = document.createElement("script"); s1.src = base + "destino.js";
  s1.onload = function () { var s2 = document.createElement("script"); s2.src = base + "redirecionar.js"; document.body.appendChild(s2); };
  document.body.appendChild(s1);
</script></body></html>
