<script src="../config.js"></script>
<script>
  /* Painel com link próprio (app/?b=apelido): o app instalado leva o nome e o logo do negócio. */
  (function () {
    var b = (new URLSearchParams(location.search).get("b") || "").toLowerCase().replace(/[^a-z0-9-]/g, "");
    try { if (b) localStorage.setItem("bs_painel_b", b); else b = localStorage.getItem("bs_painel_b") || ""; } catch (e) { /* sem armazenamento */ }
    var C = window.CONFIG || {};
    if (!b || !C.SUPABASE_URL) return;
    var base = location.origin + location.pathname.replace(/[^/]*$/, "");
    document.getElementById("manifesto").href = String(C.SUPABASE_URL).trim().replace(/\/+$/, "").replace(/\/(rest|auth|functions|storage)\/v1$/, "") +
      "/functions/v1/manifest?b=" + encodeURIComponent(b) + "&painel=1&base=" + encodeURIComponent(base);
  })();
</script>
</head>
